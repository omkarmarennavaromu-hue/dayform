<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101310">
  <meta name="description" content="A quiet, private space to keep promises to yourself, one day at a time.">
  <title>Dayform — a little progress, every day</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <button class="brand" type="button" data-action="go-today" aria-label="Dayform, go to today">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 36 36" fill="none"><path d="M8 18.5 14.1 24 28 10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="18" r="16" stroke="currentColor" stroke-opacity=".38"/></svg>
        </span>
        <span class="brand-copy"><strong>dayform</strong><small>YOUR DAILY PRACTICE</small></span>
      </button>

      <nav class="primary-nav" aria-label="Sections">
        <button class="nav-link is-active" type="button" data-action="set-view" data-view="today" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5.2v-5.6H9.2V20H4z"/></svg>
          <span>Today</span><span class="nav-indicator" aria-hidden="true"></span>
        </button>
        <button class="nav-link" type="button" data-action="set-view" data-view="history">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3.5v3M16 3.5v3M4 9.5h16M8 13h2m4 0h2M8 16.5h2"/></svg>
          <span>History</span><span class="nav-count" id="history-count">0</span>
        </button>
      </nav>

      <div class="sidebar-streak" id="sidebar-streak" aria-live="polite"></div>

      <div class="sidebar-bottom">
        <div class="sidebar-note-mark" aria-hidden="true"><span></span></div>
        <p>Made for your own pace.</p>
        <small>PRIVATE BY DESIGN · SAVED ON THIS DEVICE</small>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <div class="topbar-date-wrap">
          <span class="eyebrow topbar-label">YOUR SPACE · YOUR TIME</span>
          <p class="topbar-date" id="topbar-date"></p>
        </div>
        <div class="topbar-actions">
          <span class="save-status" id="save-status" aria-live="polite"><i class="status-dot"></i><span>Saved on this device</span></span>
          <span class="topbar-divider" aria-hidden="true"></span>
          <button class="toolbar-button" type="button" data-action="export-data" title="Download a JSON backup">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.8v9.4m0 0 3.4-3.4M10 12.2 6.6 8.8M3.5 13.4v3.1h13v-3.1"/></svg><span>Export</span>
          </button>
          <button class="toolbar-button" type="button" data-action="choose-import" title="Restore from a JSON backup">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 12.2V2.8m0 0L6.6 6.2M10 2.8l3.4 3.4M3.5 13.4v3.1h13v-3.1"/></svg><span>Import</span>
          </button>
          <input class="visually-hidden" id="import-file" type="file" accept=".json,application/json" tabindex="-1" aria-hidden="true">
        </div>
      </header>

      <div id="notice-area" class="notice-area" aria-live="polite"></div>
      <main class="page-content" id="page-content" tabindex="-1"></main>
      <footer class="app-footer"><span>dayform</span><span>Nothing leaves this browser.</span></footer>
    </div>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <dialog class="app-dialog" id="app-dialog" aria-labelledby="dialog-title">
    <div class="dialog-content" id="dialog-content"></div>
  </dialog>
  <script src="script.js" defer></script>
</body>
</html>
